# CI-based analysis, run by `.github/workflows/check.yml` (job `test`) after the tests.
# Automatic Analysis has to stay off in SonarQube Cloud, it can't import coverage reports.
sonar.projectKey=mheob_changeset-changelog
sonar.organization=mheob

# The package and the repository tooling. Sources and tests share `src`, so the test files are
# excluded from the sources (else they count as uncovered code).
sonar.sources=src,scripts,commitlint.config.ts,vite.config.ts
sonar.exclusions=coverage/**,dist/**,**/CHANGELOG.md,**/*.test.ts
sonar.tests=src
sonar.test.inclusions=**/*.test.ts

# Coverage comes from the unit tests (`vp test run --coverage`, see the `test` block in
# `vite.config.ts`). Not part of it: the scripts, the configs and `src/index.ts`, which only joins
# the two tested functions (excluded in `vite.config.ts` as well).
sonar.coverage.exclusions=scripts/**,*.config.ts,src/index.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
